<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Habsan Achievers Academy Gajiri official crest">
  <!-- Exact crest recreation: ACHIEVERS above; cap + diploma scroll + book; mirrored ACADEMY -->
  <g fill="none" stroke="#0B4D2C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer shield -->
    <path d="M200 78
      C138 78 82 92 68 112
      V198
      C68 292 122 360 200 418
      C278 360 332 292 332 198
      V112
      C318 92 262 78 200 78 Z"/>
  </g>
  <!-- Inner shield -->
  <path fill="none" stroke="#0B4D2C" stroke-width="2.4" d="M200 96
    C148 96 102 108 90 122
    V196
    C90 278 136 336 200 386
    C264 336 310 278 310 196
    V122
    C298 108 252 96 200 96 Z"/>

  <!-- ACHIEVERS above shield -->
  <text x="200" y="48" text-anchor="middle" fill="#0B4D2C"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="28" font-weight="900" letter-spacing="4">ACHIEVERS</text>

  <!-- HABSAN left: bottom-to-top (rotate -90) -->
  <text fill="#0B4D2C" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="16" font-weight="800" letter-spacing="3"
        transform="translate(98 300) rotate(-90)">HABSAN</text>

  <!-- ACADEMY right: top-to-bottom with mirrored letters (scale -1 on X after rotate) -->
  <g transform="translate(302 140) rotate(90) scale(-1,1)">
    <text fill="#0B4D2C" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="16" font-weight="800" letter-spacing="3"
          text-anchor="end" dominant-baseline="middle">ACADEMY</text>
  </g>

  <!-- Graduation cap -->
  <g fill="#0B4D2C" stroke="none">
    <polygon points="200,138 148,156 200,174 252,156"/>
    <rect x="188" y="162" width="24" height="14"/>
  </g>
  <!-- Tassel hangs LEFT -->
  <path fill="none" stroke="#0B4D2C" stroke-width="3.5" stroke-linecap="round"
        d="M148 156 V182 C148 192 162 198 174 198"/>
  <circle cx="174" cy="198" r="4.5" fill="#0B4D2C"/>

  <!-- Rolled diploma / scroll (diagonal) -->
  <g transform="translate(200 220) rotate(-34)" fill="none" stroke="#0B4D2C" stroke-width="3.6" stroke-linecap="round">
    <!-- tube body -->
    <rect x="-52" y="-12" width="104" height="24" rx="12"/>
    <!-- left roll end -->
    <ellipse cx="-52" cy="0" rx="10" ry="12"/>
    <!-- right roll end -->
    <ellipse cx="52" cy="0" rx="10" ry="12"/>
    <!-- paper lines -->
    <path stroke-width="2.2" d="M-28 0 H28"/>
    <path stroke-width="1.8" d="M-20 -5 H20 M-20 5 H20"/>
  </g>

  <!-- Open book -->
  <g fill="none" stroke="#0B4D2C" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M138 278 Q200 248 262 278 L262 312 Q200 288 138 312 Z"/>
    <path d="M200 254 V300"/>
    <path stroke-width="2.2" d="M152 278 H180 M152 288 H178 M152 298 H176"/>
    <path stroke-width="2.2" d="M220 278 H248 M222 288 H248 M224 298 H248"/>
  </g>

  <!-- GAJIRI -->
  <text x="200" y="352" text-anchor="middle" fill="#0B4D2C"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="20" font-weight="900" letter-spacing="4">GAJIRI</text>

  <!-- Motto ribbon -->
  <path fill="#0B4D2C" d="M42 400 H358 L338 442 H62 Z"/>
  <path fill="#0B4D2C" d="M42 400 L20 422 L42 442 Z"/>
  <path fill="#0B4D2C" d="M358 400 L380 422 L358 442 Z"/>
  <text x="200" y="428" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12.5" font-weight="800" letter-spacing="0.8">
    MOTTO: KNOWLEDGE, DISCIPLINE &amp; EXCELLENCE
  </text>
</svg>
