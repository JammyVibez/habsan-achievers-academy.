<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" role="img" aria-label="Habsan Achievers Academy Gajiri crest">
  <!-- Official crest: dark green line art on white -->
  <g fill="none" stroke="#0b4d2c" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Shield -->
    <path d="M160 16
      C105 16 58 28 44 44
      V152
      C44 236 90 300 160 356
      C230 300 276 236 276 152
      V44
      C262 28 215 16 160 16 Z"/>
  </g>

  <!-- Inner rim -->
  <path fill="none" stroke="#0b4d2c" stroke-width="2" d="M160 32
    C114 32 74 42 62 54
    V150
    C62 222 100 278 160 328
    C220 278 258 222 258 150
    V54
    C246 42 206 32 160 32 Z"/>

  <!-- ACHIEVERS along top -->
  <path id="achieversArc" d="M84 82 Q160 50 236 82" fill="none"/>
  <text fill="#0b4d2c" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">
    <textPath href="#achieversArc" startOffset="50%" text-anchor="middle">ACHIEVERS</textPath>
  </text>

  <!-- Side words -->
  <text fill="#0b4d2c" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2"
        transform="translate(72 228) rotate(-90)">HABSAN</text>
  <text fill="#0b4d2c" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2"
        transform="translate(252 112) rotate(90)">ACADEMY</text>

  <!-- Graduation cap (tassel hangs left) -->
  <g fill="#0b4d2c" stroke="none">
    <polygon points="160,98 108,116 160,134 212,116"/>
    <rect x="148" y="122" width="24" height="14"/>
  </g>
  <path fill="none" stroke="#0b4d2c" stroke-width="3.5" stroke-linecap="round"
        d="M108 116 V138 C108 148 124 154 136 154"/>
  <circle cx="136" cy="154" r="4.5" fill="#0b4d2c"/>

  <!-- Diploma scroll diagonal -->
  <g transform="translate(160 176) rotate(-32)" fill="none" stroke="#0b4d2c" stroke-width="3.5" stroke-linecap="round">
    <rect x="-46" y="-11" width="92" height="22" rx="10"/>
    <path d="M-46 -11 C-58 -11 -58 11 -46 11"/>
    <path d="M46 -11 C58 -11 58 11 46 11"/>
    <path stroke-width="2.5" d="M-22 0 H22"/>
  </g>

  <!-- Open book -->
  <g fill="none" stroke="#0b4d2c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M108 236 Q160 208 212 236 L212 268 Q160 246 108 268 Z"/>
    <path d="M160 214 V258"/>
    <path stroke-width="2.2" d="M120 236 H144 M120 246 H142 M120 256 H140"/>
    <path stroke-width="2.2" d="M176 236 H200 M178 246 H200 M180 256 H200"/>
  </g>

  <!-- GAJIRI -->
  <text x="160" y="302" text-anchor="middle" fill="#0b4d2c"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="3">GAJIRI</text>

  <!-- Motto ribbon -->
  <path fill="#0b4d2c" d="M28 332 H292 L276 368 H44 Z"/>
  <path fill="#0b4d2c" d="M28 332 L10 350 L28 368 Z"/>
  <path fill="#0b4d2c" d="M292 332 L310 350 L292 368 Z"/>
  <text x="160" y="355" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.6">
    MOTTO: KNOWLEDGE, DISCIPLINE &amp; EXCELLENCE
  </text>
</svg>
